name: Laya introduction probe (one game per provider)
on:
  workflow_dispatch:
    inputs:
      confirm_adult:
        type: boolean
        default: false
      confirm_age_21:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hybrid-verified-300-batch
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PILOT_RUN_ID: catalog-300-20261021
      PILOT_CONFIRM_ADULT: ${{ inputs.confirm_adult }}
      PILOT_CONFIRM_AGE_21: ${{ inputs.confirm_age_21 }}
      HYBRID_FUZZER_URL: https://hybrid-cloud-fuzzer.braian-n-l.workers.dev
      HYBRID_REVIEW_TOKEN: ${{ secrets.HYBRID_REVIEW_TOKEN }}
      HYBRID_INGEST_TOKEN: ${{ secrets.HYBRID_INGEST_TOKEN }}
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Shisetsu-Code/hybrid-cloud-fuzzer
          ref: a41ceed63900a6a778c6e864e0ec8e7fe44a9e9d
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - run: python -m pip install --disable-pip-version-check -r requirements-laya-probe.txt
      - run: python scripts/laya-intro.py --warmup
      - run: npm --prefix engine ci --ignore-scripts --no-audit --no-fund
      - run: node engine/node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/probe-laya-intros.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laya-intro-probe-report
          path: laya-intro-probe.json
          if-no-files-found: warn
          retention-days: 14
