name: Audit stored screenshots before GPT
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing catalogue batch to inspect without changing classifications
        required: true
        default: catalog-300-20261021
permissions:
  contents: read
concurrency:
  group: hybrid-verified-300-batch
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HYBRID_FUZZER_URL: https://hybrid-cloud-fuzzer.braian-n-l.workers.dev
      HYBRID_REVIEW_TOKEN: ${{ secrets.HYBRID_REVIEW_TOKEN }}
      HYBRID_INGEST_TOKEN: ${{ secrets.HYBRID_INGEST_TOKEN }}
      PILOT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - run: python -m pip install --disable-pip-version-check -r requirements-launchers.txt
      - run: node scripts/audit-capture-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-audit-summary
          path: validation-summary.json
          if-no-files-found: warn
          retention-days: 14
