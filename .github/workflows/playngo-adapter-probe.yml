name: Probe Play'n GO Real Mobile Adapter
on:
  push:
    branches: [feat/playngo-mobile-catalog-adapter-20261021]
    paths:
      - '.github/workflows/playngo-adapter-probe.yml'
      - 'src/playngo.mjs'
      - 'test/playngo-live-adapter.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Shisetsu-Code/hybrid-cloud-fuzzer
          ref: a41ceed63900a6a778c6e864e0ec8e7fe44a9e9d
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm --prefix engine ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: node engine/node_modules/playwright/cli.js install --with-deps chromium
      - name: Capture one approved public Play'n GO mobile DEMO without uploads or wagers
        run: node test/playngo-live-adapter.mjs
