name: CI — distributed DEMO scheduler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Bound package mirror retries on ephemeral runner
        run: |
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99hybrid-network-timeouts >/dev/null
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Shisetsu-Code/hybrid-cloud-fuzzer
          ref: a41ceed63900a6a778c6e864e0ec8e7fe44a9e9d
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix engine ci --ignore-scripts --no-audit --no-fund
      - run: node engine/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - run: python -m pip install Pillow==11.3.0 pytesseract==0.3.13
      - name: Run mocked Chromium and OCR integration on GitHub runner
        env:
          INTEGRATION_BROWSER: '1'
          CAPTURE_OCR_INTEGRATION: '1'
        run: npm test
